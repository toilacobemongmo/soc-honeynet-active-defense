# Cấu hình Hệ thống Active Defense & SOAR Honeynet
system:
  name: "Mini-SOC Active Defense & Deception Framework"
  version: "2.1.0"
  environment: "production" # hoặc "development"
  log_level: "INFO"

# Đường dẫn dữ liệu Cowrie
cowrie:
  log_path: "./data/cowrie.json"          # Hoặc /var/log/cowrie/cowrie.json trên Linux
  downloads_path: "./data/downloads"       # Thư mục lưu malware do hacker drop vào
  custom_fs_path: "./data/fs.pickle"

# Cấu hình Telegram SOAR Bot (Tương tác 2 chiều)
telegram:
  enabled: true
  bot_token: "8992402471:AAHD8NvQwUmibSTXWHQQgV7Zf6GFspN-Pls"    # Bot Token được cung cấp
  chat_id: "YOUR_TELEGRAM_CHAT_ID"        # Thay bằng Chat ID của bạn (nhắn /start cho bot hoặc dùng @userinfobot)
  poll_interval_sec: 2

# Tích hợp Threat Intelligence (Trinh sát ngược)
threat_intel:
  abuseipdb:
    enabled: true
    api_key: "ad06064fb71a444e1659791e89b3c3194e0816474c05fd88f19ed8a9b66e51a4aefd43396bdf8431"
    confidence_threshold: 40            
  shodan:
    enabled: true
    api_key: "wAijerlbsjvpCOyzeZ8Arnp8D3cgpHwG"
  virustotal:
    enabled: true
    api_key: "57fee4f2beeac4df0251737a3b1dd6754b1faee41ad64f3fd151150ec634744f"
  reverse_nmap:
    enabled: true
    safe_mode: true                       # Chỉ quét cổng phổ biến (21,22,23,80,443,8080,8888,3389,5900)
    top_ports: 20

honeytokens:
  enabled: true
  callback_url: "https://canarytokens.org/generate" # Hoặc webhook riêng của bạn
  decoy_files:
    - path: "/home/root/.aws/credentials"
      description: "Fake AWS Access Key có nhúng Webhook Beacon"
    - path: "/root/.bash_history"
      description: "Chứa lịch sử curl bí mật đến tracking server"
    - path: "/var/backups/db_dump_passwords.txt"
      description: "Canary URL nhử hacker mở trình duyệt tải về"

# Quy tắc SOAR (Automated Incident Response)
soar_rules:
  # Quy tắc 1: Phát hiện Brute-force mật khẩu (MITRE ATT&CK T1110)
  brute_force:
    threshold_attempts: 5                 # Quá 5 lần login sai
    time_window_sec: 60                   # Trong vòng 60 giây
    action: "tarpit_and_alert"            # Hành động: giam lỏng + cảnh báo

  # Quy tắc 2: Đăng nhập thành công vào Honeypot (MITRE ATT&CK T1078)
  successful_login:
    action: "reverse_recon_and_monitor"   # Trinh sát ngược tức thì + kích hoạt bẫy

  # Quy tắc 3: Tải mã độc lên máy bẫy (MITRE ATT&CK T1105)
  payload_dropped:
    action: "quarantine_and_scan"         # Tự động cách ly, tính SHA256, tra cứu VT

  # Quy tắc 4: Tự động chặn Firewall (iptables / nftables)
  firewall_enforcement:
    auto_block: true
    block_duration_sec: 3600              # Chặn 1 giờ
    whitelist:
      - "127.0.0.1"
      - "192.168.1.1"
